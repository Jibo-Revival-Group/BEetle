name: Build BEetle

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-tk xvfb
          /usr/bin/python3 -m venv .venv
          .venv/bin/pip install paramiko
      - name: Tests (robot steps, var edit, PM over SSH, the whole window)
        env: {BEETLE_REQUIRE_E2FS: '1'}
        run: xvfb-run -a .venv/bin/python -m unittest discover -s tests -t . -v

  windows-tools:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 p7zip-full
      - run: python3 build/build.py windows-tools windows-tools
      - uses: actions/upload-artifact@v4
        with: {name: windows-tools, path: windows-tools/, if-no-files-found: error}

  linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-tk libfuse2 pkg-config
          /usr/bin/python3 -m venv .venv
          .venv/bin/pip install pyinstaller==6.16.0 paramiko pillow
      - run: .venv/bin/python build/build.py tools
      - run: .venv/bin/python build/build.py freeze
      - name: Check the AppImage
        run: |
          release-out/BEetle-x86_64.AppImage --appimage-extract-and-run --version
          release-out/BEetle-x86_64.AppImage --appimage-extract-and-run --self-check
      - uses: actions/upload-artifact@v4
        with: {name: BEetle-Linux, path: release-out/, if-no-files-found: error}

  macos:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - run: |
          brew install --overwrite python@3.12 python-tk@3.12 pkg-config
          "$(brew --prefix python@3.12)/bin/python3.12" -m venv .venv
          .venv/bin/pip install pyinstaller==6.16.0 paramiko pillow
      - run: .venv/bin/python build/build.py tools
      - run: .venv/bin/python build/build.py freeze
      - name: Check the app
        run: |
          cd "$RUNNER_TEMP" && ditto -x -k "$GITHUB_WORKSPACE"/release-out/*.app.zip .
          BEetle.app/Contents/MacOS/BEetle --version
          BEetle.app/Contents/MacOS/BEetle --self-check
      - uses: actions/upload-artifact@v4
        with:
          name: BEetle-macOS-${{ matrix.runner }}
          path: release-out/
          if-no-files-found: error

  windows:
    needs: [test, windows-tools]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: {name: windows-tools, path: windows-tools}
      - uses: cygwin/cygwin-install-action@v4
        with: {packages: gcc-core make, install-dir: 'C:\cygwin'}
      - name: Build e2fsprogs 1.47.1 with Cygwin
        shell: C:\cygwin\bin\bash.exe --login -eo pipefail -o igncr '{0}'
        run: |
          cd /tmp
          curl -fsSLO https://www.kernel.org/pub/linux/kernel/people/tytso/e2fsprogs/v1.47.1/e2fsprogs-1.47.1.tar.gz
          echo "0d2e0bf80935c3392b73a60dbff82d8a6ef7ea88b806c2eea964b6837d3fd6c2  e2fsprogs-1.47.1.tar.gz" | sha256sum -c
          tar xzf e2fsprogs-1.47.1.tar.gz && cd e2fsprogs-1.47.1
          ./configure --prefix=/opt/e2fsprogs --disable-nls --disable-fuse2fs --disable-uuidd \
            --without-udev-rules-dir --without-systemd-unit-dir --without-crond-dir
          make -j4 && make install
          /opt/e2fsprogs/sbin/debugfs -V
      - uses: actions/setup-python@v6
        with: {python-version: '3.12', architecture: x64}
      - run: python -m pip install pyinstaller==6.16.0 paramiko pillow
      - run: python build/build.py windows-runtime windows-tools
      - name: Var edit with the bundled Cygwin debugfs and e2fsck
        shell: pwsh
        env: {BEETLE_REQUIRE_E2FS: '1'}
        run: |
          $env:PATH = "$pwd\dfu\tools;C:\cygwin\opt\e2fsprogs\sbin;$env:PATH"
          python -m unittest tests.test_flow tests.test_var_edit -v
      - run: python build/build.py freeze
      - name: Check the exe
        shell: pwsh
        run: |
          $p = Start-Process release-out/BEetle.exe -ArgumentList '--self-check',"$env:RUNNER_TEMP\check.json" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\check.json"
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - uses: actions/upload-artifact@v4
        with: {name: BEetle-Windows, path: release-out/, if-no-files-found: error}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with: {path: artifacts, pattern: BEetle-*, merge-multiple: true}
      - run: cd artifacts && sha256sum * > SHA256SUMS && ls -la
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: artifacts/*
