name: BEetle native Windows
on:
  workflow_dispatch:
  push:
    paths:
      - '**.py'
      - 'scripts/release/**'
      - '.github/workflows/windows-native.yml'
      - 'requirements-release.txt'
  pull_request:
    paths:
      - '**.py'
      - 'scripts/release/**'
      - '.github/workflows/windows-native.yml'
      - 'requirements-release.txt'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install Windows build dependencies
        run: python -m pip install -r requirements-release.txt
      - uses: cygwin/cygwin-install-action@v6
        with:
          packages: >-
            gcc-core make binutils git patch pkg-config
            mingw64-x86_64-gcc-core
          add-to-path: false
      - name: Run Windows portability tests
        run: python -m pytest -q tests/test_windows_native.py tests/test_release_builds.py tests/test_gui_controller.py
      - name: Build and test direct Windows EXE
        run: python scripts/release/build.py --windows-native --cygwin-root C:/cygwin
      - uses: actions/upload-artifact@v4
        with:
          name: BEetle-Windows-x64
          path: release-out/
          if-no-files-found: error
