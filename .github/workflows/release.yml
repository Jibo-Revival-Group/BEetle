name: BEetle native bundles

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-tk libusb-1.0-0-dev gcc-arm-none-eabi binutils-arm-none-eabi pkg-config libfuse2 xvfb patchelf busybox nodejs
          python -m venv .build-venv
          .build-venv/bin/python -m pip install -r requirements-release.txt
      - name: Regression tests
        run: .build-venv/bin/python -m pytest -q
      - name: Build and verify AppImage
        run: .build-venv/bin/python scripts/release/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: BEetle-linux-stage
          path: release-out/
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: cygwin/cygwin-install-action@v6
        id: cygwin
        with:
          packages: gcc-core make binutils git patch pkg-config mingw64-x86_64-gcc-core mingw64-x86_64-gcc-g++
          add-to-path: false
      - name: Build and verify native single EXE
        run: |
          python -m pip install -r requirements-release.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q tests/test_windows_native.py tests/test_release_builds.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/release/build.py --windows-native --cygwin-root '${{ steps.cygwin.outputs.root }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: BEetle-Windows-x64
          path: release-out/
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: |
          test "$(uname -m)" = '${{ matrix.architecture }}'
          brew install --overwrite python@3.12 python-tk@3.12 pkg-config
          "$(brew --prefix python@3.12)/bin/python3.12" -m venv .build-venv
          .build-venv/bin/python -m pip install -r requirements-release.txt
      - name: Build native app, ZIP and DMG
        run: .build-venv/bin/python scripts/release/build.py --architecture '${{ matrix.architecture }}'
      - uses: actions/upload-artifact@v4
        with:
          name: BEetle-macOS-${{ matrix.architecture }}
          path: release-out/
          if-no-files-found: error
      - name: Verify mounted app
        run: .build-venv/bin/python scripts/release/verify_macos.py 'release-out/BEetle-macOS-${{ matrix.architecture }}.dmg'
