name: BEetle setup and GUI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y e2fsprogs python3-tk xvfb
      - run: python -m pip install pytest pillow
      - run: python scripts/install_setup_deps.py
      - run: python -m pytest -q
      - run: xvfb-run -a env JIBO_GUI_TEST_DISPLAY=1 python -m pytest -q tests/test_gui_window.py tests/test_docs_screenshots.py tests/test_gui_controller.py
